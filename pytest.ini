[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --alluredir=allure-results
    -v
markers =
    route_display: Route display functionality tests
    route_selection: Route selection block tests
    taxi_preparation: Taxi order preparation tests
    taxi_order: Taxi order flow tests
    xfail: Expected to fail tests